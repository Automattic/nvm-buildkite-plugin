steps:
  - command: make test

  - command: make validate

  - label: ":node: Validate {{ matrix.node }} via version property"
    command: .buildkite/verify_node.sh {{ matrix.node }}
    plugins:
      - automattic/nvm#${BUILDKITE_COMMIT}:
          version: "{{ matrix.node }}"
    env:
      IMAGE_ID: xcode-15.2
    agents:
      queue: "{{ matrix.queue }}"
    matrix:
      setup:
        node:
          # Node.js v18 and later don't work on the current build agent.
          # Once we switch to a newer OS for the default agent, we can add more
          # Node.js versions here.
          # See https://github.com/nvm-sh/nvm/issues/2972
          - v17
          - v16
        queue:
          - mac
          - default

  # EXPERIMENT: same explicit-version Windows jobs that hang, but with a .nvmrc
  # generated in the working directory. If these pass, .nvmrc presence is what
  # prevents the post-checksum hang on the explicit-version path.
  - label: ":windows: :node: Validate {{ matrix.node }} on Windows"
    command: bash .buildkite/verify_node.sh {{ matrix.node }}
    env:
      NVM_BUILDKITE_PLUGIN_TEST_NVMRC_VERSION: "{{ matrix.node }}"
    plugins:
      - automattic/nvm#${BUILDKITE_COMMIT}:
          version: "{{ matrix.node }}"
    agents:
      queue: windows
    matrix:
      setup:
        node:
          - v20.19.5
          - v24.15.0

  - label: ":windows: :node: Validate .nvmrc fallback on Windows"
    env:
      # Create an .nvmrc file to verify the plugin reads it
      NVM_BUILDKITE_PLUGIN_TEST_NVMRC_VERSION: 20.19.5
    command: bash .buildkite/verify_node.sh "$(cat .nvmrc)"
    plugins:
      - automattic/nvm#${BUILDKITE_COMMIT}
    agents:
      queue: windows

  - label: ":node: Validate .nvmrc fallback" 
    env:
      # Create an .nvmrc file to verify the plugin reads it
      NVM_BUILDKITE_PLUGIN_TEST_NVMRC_VERSION: 24.18.0
    command: .buildkite/verify_node.sh "$(cat .nvmrc)"
    plugins:
      - automattic/nvm#${BUILDKITE_COMMIT}

  # More details on what is being test here can be found at
  # https://github.com/Automattic/nvm-buildkite-plugin/pull/9
  - label: ":node: [Test] source nvm from npm script"
    command: cd tests/dummy && npm install
    plugins:
      - automattic/nvm#${BUILDKITE_COMMIT}:
          version: v17
    env:
      IMAGE_ID: xcode-15.2
    agents:
      queue: "{{ matrix.queue }}"
    matrix:
      setup:
        queue:
          - mac
          - default

  - label: ":node: [Test] curlrc option"
    command: |
      set -euo pipefail

      echo "--- Verify Node.js installation"
      cd tests/dummy && npm install

      echo "--- Verify curl output is NOT verbose"
      curl -s https://google.com

      if curl -s https://google.com 2>&1 | grep -F HTTP; then
        echo "curl command that is invoked in pipeline script should not be verbose"
        exit 1
      fi
    plugins:
      - automattic/nvm#${BUILDKITE_COMMIT}:
          version: v17
          curlrc: --verbose
    env:
      IMAGE_ID: xcode-15.2
    agents:
      queue: "{{ matrix.queue }}"
    matrix:
      setup:
        queue:
          - mac
          - default
